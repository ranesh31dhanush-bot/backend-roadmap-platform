<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Terminal Prompt Gradient -->
    <linearGradient id="promptGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Dash Gradient -->
    <linearGradient id="dashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#06b6d4" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4.5" filter="url(#glow)" />

  <!-- Inner subtle grid lines (representing backend distributed systems) -->
  <path d="M6 44 H122 M6 84 H122 M44 6 V122 M84 6 V122" stroke="rgba(56, 189, 248, 0.05)" stroke-width="1.5" />

  <!-- Terminal Command Prompt: > -->
  <path d="M34 40 L60 64 L34 88" fill="none" stroke="url(#promptGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Terminal Underscore / Cursor: _ -->
  <path d="M72 88 H98" fill="none" stroke="url(#dashGrad)" stroke-width="10" stroke-linecap="round" />

  <!-- Top 1% Elite Gold Badge Dot -->
  <circle cx="94" cy="38" r="7.5" fill="#f59e0b" stroke="#fbbf24" stroke-width="2" />
  <circle cx="94" cy="38" r="3.5" fill="#fef08a" />
</svg>
